# Paper-aligned QLoRA run for KITE + Qwen2.5-VL-7B.
#
# Values explicitly reported by the KITE paper are rank=8, 4-bit
# quantization, one epoch, and lr=1e-5.  The paper does not report batch size,
# optimizer hyperparameters, LoRA alpha/dropout, or warmup; the values below
# are the reproducibility choices for this implementation.  The runner probes
# micro-batch size on the selected GPU and chooses the largest batch whose peak
# allocation is no more than target_vram_fraction of total VRAM.

base_model: model/Qwen2.5-VL-7B-Instruct
train_file: data/robofac/training_qa.json
data_root: data/robofac
output_dir: model/kite-lora-paper-full

# Full run: do not set max_samples or max_steps.
max_samples: null
max_steps: -1
num_train_epochs: 1.0

# Paper: 1e-5.  Requested implementation choices: 3% warmup and AdamW.
learning_rate: 1.0e-5
warmup_ratio: 0.03
optimizer: adamw_torch
weight_decay: 0.01
gradient_accumulation_steps: 1

# Paper: rank 8.  Alpha 64 is explicitly requested for this run.
lora_rank: 8
lora_alpha: 64
lora_dropout: 0.05

# Auto-tune the per-device micro-batch to approximately 80% VRAM.
per_device_train_batch_size: auto
target_vram_fraction: 0.80
max_batch_size: 160

# KITE paper input budget and image size.
num_frames: 8
fps: 1.0
max_pixels: 262144       # 512 x 512

# QLoRA and paper's trainable visual merger.
use_4bit: true
unfreeze_merger: true

save_steps: 250
logging_steps: 10
save_total_limit: 2
dataloader_num_workers: 0
decode_workers: 16
# Coarse locality only: keep a few videos hot for the decoder, but interleave
# their QA rows so one video cannot fill an entire batch.
videos_per_window: 8
max_samples_per_video_per_batch: 4
seed: 42
trust_remote_code: false
